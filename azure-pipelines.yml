trigger:
  branches:
    include:
      - main

pool: infra_pool

stages:
- stage: InfraStage
  displayName: "Infrastructure Stage"

  jobs:
  - job: TerraformJob
    displayName: "Terraform Deployment"

    steps:
    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "latest"

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: "azurerm"
        command: "init"
        backendServiceArm: "infra_connection"
        backendAzureRmStorageAccountName: "teststoragehellohi"
        backendAzureRmContainerName: "hellohihi"
        backendAzureRmKey: "infra.tfstate"

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: "azurerm"
        command: "plan"
        environmentServiceNameAzureRM: "infra_connection"

    - task: TerraformTask@5
      displayName: "Terraform Apply"
      inputs:
        provider: "azurerm"
        command: "apply"
        environmentServiceNameAzureRM: "infra_connection"